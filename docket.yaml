# The projects this vault holds, and the vocabulary they share.
# A key is PROJECT-NUMBER and the project is a folder at the root.
# transitions is the workflow; leaving it out means anything can move
# to anything.
name: Acme
projects:
  - key: ACME
    name: Acme
  - key: BETA
    name: Beta Platform
statuses:
  - name: Backlog
    category: todo
  - name: Ready
    category: todo
  - name: In progress
    category: doing
  - name: In review
    category: doing
  - name: Done
    category: done
  - name: Dropped
    category: done
types:
  - task
  - bug
  - story
  - epic
priorities:
  - low
  - normal
  - high
  - urgent
